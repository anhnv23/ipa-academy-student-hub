name: Populate IPA portal sample data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE PORTAL SAMPLE
        required: true
        type: string

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Populate linked portal data
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONFIRM_PORTAL_SAMPLE: ${{ inputs.confirmation }}
        run: node scripts/populate-portal-sample-data.mjs
