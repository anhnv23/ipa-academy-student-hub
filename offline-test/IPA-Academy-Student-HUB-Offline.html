<body>
<button id="cloud" class="cloud" onclick="setupSupabase()">⚙ Supabase</button>
<div id="language" class="lang"><button class="active" onclick="setLang('vi')">VI</button><button onclick="setLang('en')">EN</button></div>
<div id="login" class="login"></div><div id="app" class="hidden"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const state={role:null,view:'overview',lang:'vi',classTab:'classes',user:null};let db=null;
function initSupabase(){const url=localStorage.getItem('ipa_supabase_url'),key=localStorage.getItem('ipa_supabase_key');if(url&&key&&window.supabase){db=window.supabase.createClient(url,key);document.getElementById('cloud')?.classList.add('on');document.getElementById('cloud').textContent='Supabase';return true}return false}
function setupSupabase(){const url=localStorage.getItem('ipa_supabase_url')||'',key=localStorage.getItem('ipa_supabase_key')||'';document.getElementById('modal').innerHTML=`<div class="modal-layer"><div class="backdrop" onclick="closeModal()"></div><form class="modal" onsubmit="saveSupabase(event)"><div class="modal-head"><h2>⚙ Supabase Shared Database</h2><button type="button" onclick="closeModal()">✕</button></div><p class="sub">Thông tin này được lưu trên máy hiện tại. Chỉ sử dụng Project URL và anon public key.</p><div class="form"><label class="full">Supabase Project URL<input id="sb-url" required value="${url}" placeholder="https://xxxx.supabase.co"></label><label class="full">Supabase anon public key<textarea id="sb-key" required rows="4" placeholder="eyJ...">${key}</textarea></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Hủy</button><button class="btn">Lưu & kết nối</button></div></form></div>`}
function saveSupabase(e){e.preventDefault();localStorage.setItem('ipa_supabase_url',document.getElementById('sb-url').value.trim());localStorage.setItem('ipa_supabase_key',document.getElementById('sb-key').value.trim());closeModal();if(initSupabase()){showToast('Đã kết nối Supabase.');renderLogin()}}
async function cloudLogin(e){e.preventDefault();if(!db)return setupSupabase();const email=document.getElementById('cloud-email').value,password=document.getElementById('cloud-password').value,button=e.submitter;button.disabled=true;button.textContent='...';const{data,error}=await db.auth.signInWithPassword({email,password});if(error){button.disabled=false;button.textContent='Đăng nhập';return alert(error.message)}const{data:profile,error:pErr}=await db.from('profiles').select('role,full_name').eq('id',data.user.id).single();if(pErr||!profile)return alert('Tài khoản chưa có hồ sơ hoặc vai trò.');state.user=data.user;state.role=profile.role;state.view='overview';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadSharedClasses();renderApp()}
async function loadSharedClasses(){if(!db)return;const{data,error}=await db.from('classes').select('*').order('created_at');if(!error&&data?.length)classes=data.map(c=>[c.code,c.name,c.level||'',c.student_count||0,c.teacher_name||'',c.schedule_text||'',String(c.completed_sessions||0)+'/'+String(c.total_sessions||0),c.room||'',c.attendance_rate||0])}

function account(r,icon,title,name,email,note){return `<button class="account" onclick="login('${r}')"><i>${icon}</i><span><strong>${title} — ${name}</strong><small>${email}</small><em>${note}</em></span><b>›</b></button>`}

function navItems(){if(state.role==='admin')return[['overview',t.overview],['students',t.students],['classes',t.classes],['assignments',t.assign],['reports',t.reports]];if(state.role==='teacher')return[['overview',t.classOverview],['students',t.myStudents],['assignments',t.grading],['reports',t.review]];return[['overview',t.home],['assignments',t.mine],['reports',t.progress],['leave',t.leave]]}
function go(v){state.view=v;renderApp()}function toggleMenu(){document.querySelector('.sidebar').classList.toggle('open')}
function renderApp(){const name=state.role==='admin'?'IPA Admin':state.role==='teacher'?'Cô Mai Anh':'Minh Anh';document.getElementById('app').innerHTML=`<aside class="sidebar">${logo()}<nav class="nav">${navItems().map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><div class="profile"><div class="avatar">${state.role==='admin'?'AD':state.role==='teacher'?'GV':'HV'}</div><span><strong>${name}</strong><small>${t[state.role]}</small></span></div></aside><main class="main"><header class="top"><button class="mobile-menu" onclick="toggleMenu()">☰</button><h1>${navItems().find(n=>n[0]===state.view)?.[1]}</h1><div class="right"><span class="badge">${t[state.role].toUpperCase()}</span><button class="logout" onclick="logout()">↪ ${t.logout}</button></div></header><div class="content">${view()}</div></main>`}
function view(){if(state.role==='admin'&&state.view==='classes')return classManagement();if(state.view==='overview')return overview();if(state.view==='students')return studentsView();if(state.view==='assignments')return assignmentsView();if(state.view==='reports')return reportsView();return leaveView()}
function overview(){return `<section class="hero"><div><span class="eyebrow" style="color:var(--lime)">IPA ACADEMY</span><h2>${t.hello}, ${state.role==='admin'?'IPA Admin':state.role==='teacher'?'Cô Mai Anh':'Minh Anh'}</h2><p>${state.role==='admin'?t.today:state.role==='teacher'?'3 lớp học cần bạn theo dõi.':'Bạn đang tiến rất tốt!'}</p></div><button class="btn" onclick="showToast()">＋ ${state.role==='student'?t.mine:t.newAssignment}</button></section><section class="stats">${stat(t.activeStudents,state.role==='admin'?'248':'48','+12')}${stat(t.activeClasses,state.role==='admin'?'18':'3','8 hôm nay')}${stat(t.pending,state.role==='student'?'3':'16','Cần xử lý')}${stat(t.attendance,'93.6%','+1.8%')}</section><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>${t.recent}</h3><p>IELTS • Junior • Communication</p></div></div><div class="tasks">${task('Writing Task 2 — Education','I67-A • 14/18')}${task('Speaking recording','J4-B • 11/15')}${task('Vocabulary Review','IF-C • 16/16')}</div></section><section class="panel"><div class="panel-head"><div><h3>${t.actions}</h3><p>Today</p></div></div><div class="tasks">${task('12 '+t.pending,'IELTS 6.5')}${task('3 '+t.leave,'Academic Services')}${task('5 '+t.students,'New profiles')}</div></section></div>`}
function stat(a,b,c){return `<article class="stat"><span>${a}</span><b>${b}</b><small>${c}</small></article>`}function task(a,b){return `<article><i class="dot"></i><span><b>${a}</b><small>${b}</small></span></article>`}
function classManagement(){return `<div class="panel-head"><div><h2>${t.classTitle}</h2><p>${t.classSub}</p></div><button class="btn" onclick="classModal()">＋ ${t.createClass}</button></div><div class="tabs"><button class="${state.classTab==='classes'?'active':''}" onclick="classTab('classes')">▣ ${t.classList}</button><button class="${state.classTab==='calendar'?'active':''}" onclick="classTab('calendar')">▦ ${t.centerCalendar}</button><button class="${state.classTab==='attendance'?'active':''}" onclick="classTab('attendance')">✓ ${t.attendanceTab}</button></div>${state.classTab==='classes'?classList():state.classTab==='calendar'?calendar():attendance()}`}
function classTab(x){state.classTab=x;renderApp()}function classList(){return `<section class="stats">${stat(t.totalClasses,'18','15 '+t.active)}${stat(t.enrolled,'248','12 new')}${stat(t.sessionsWeek,'42','2 make-up')}${stat(t.attendance,'93.6%','+1.8%')}</section><section class="panel"><div class="toolbar"><input placeholder="${t.search}" oninput="filterClasses(this.value)"><button class="btn secondary">${t.active}</button><button class="btn secondary">${t.allLevels}</button></div><div id="classgrid" class="class-grid">${classes.map(classCard).join('')}</div></section>`}
function classCard(c){return `<button class="class-card" data-search="${c.join(' ').toLowerCase()}" onclick="classModal('${c[0]}')"><div class="class-head"><span class="code">${c[0]}</span><span class="status">${t.active}</span></div><h3>${c[1]}</h3><p>${c[2]} • ${t.classroom} ${c[7]}</p><div class="details"><div><small>${t.students}</small><b>${c[3]}</b></div><div><small>${t.teacher}</small><b>${c[4]}</b></div><div><small>${t.schedule}</small><b>${c[5]}</b></div><div><small>${t.sessions}</small><b>${c[6]}</b></div></div><progress value="${parseInt(c[6])}" max="${parseInt(c[6].split('/')[1])}"></progress></button>`}
function filterClasses(q){document.querySelectorAll('.class-card').forEach(el=>el.classList.toggle('hidden',!el.dataset.search.includes(q.toLowerCase())))}
function calendar(){let ds=['Mon 14/09','Tue 15/09','Wed 16/09','Thu 17/09','Fri 18/09','Sat 19/09'];return `<section class="panel"><div class="panel-head"><div><h3>${t.centerSchedule}</h3><p>14/09–20/09/2026</p></div></div><div class="week">${ds.map((d,i)=>`<article class="day ${i===1?'today':''}"><strong>${d}</strong><div class="event"><b>${classes[i%4][0]} • ${i%2?'18:00':'20:00'}</b><span>${classes[i%4][4]}</span></div></article>`).join('')}</div></section>`}
function attendance(){let ns=['Nguyễn Minh Anh','Trần Gia Huy','Lê Khánh Linh','Phạm Đức Minh','Vũ Quỳnh Chi'];return `<section class="hero"><div><h2>IELTS 6.5 • I67-A</h2><p>18:00–19:30 • Ocean • 25/36</p></div><button class="btn" onclick="showToast()">${t.saveAttendance}</button></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>${t.studentList}</h3><p>${t.approvedAuto}</p></div></div>${ns.map((n,i)=>`<div class="attendance-row"><div class="avatar">${n.split(' ').slice(-2).map(x=>x[0]).join('')}</div><span><b>${n}</b><small>IPA-240${31+i*7}</small></span><div class="attendance-actions"><button class="${i!==1&&i!==3?'on':''}">${t.present}</button><button class="${i===1?'on':''}">${t.excused}</button><button class="${i===3?'on':''}">${t.absent}</button></div></div>`).join('')}</section>`}
function classModal(code){let c=classes.find(x=>x[0]===code);document.getElementById('modal').innerHTML=`<div class="modal-layer"><div class="backdrop" onclick="closeModal()"></div><form class="modal" onsubmit="saveClass(event)"><div class="modal-head"><h2>${c?t.classes:t.createNew}</h2><button type="button" onclick="closeModal()">✕</button></div><div class="form"><label>${t.className}<input required value="${c?.[1]||''}"></label><label>${t.classCode}<input required value="${c?.[0]||''}"></label><label>${t.startDate}<input type="date" value="2026-09-14"></label><label>${t.numSessions}<input type="number" value="30"></label><label>${t.startTime}<input type="time" value="18:00"></label><label>${t.endTime}<input type="time" value="19:30"></label><label>${t.teacher}<select><option>Cô Mai Anh</option><option>Thầy David</option></select></label><label>${t.assistant}<select><option>Ms. Linh</option><option>Mr. Nam</option></select></label><label>${t.room}<select><option>Ocean</option><option>Forest</option><option>Sky</option></select></label><label>${t.level}<input value="${c?.[2]||''}"></label><label class="full">${t.curriculum}<textarea>IPA Core Curriculum 2026</textarea></label><label class="full">${t.outcomes}<textarea>Expected proficiency for the selected learning pathway.</textarea></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">${t.cancel}</button><button class="btn">${c?'Save':t.create}</button></div></form></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}async function saveClass(e){e.preventDefault();const f=[...e.target.querySelectorAll('input,select,textarea')];if(db&&state.user){const row={name:f[0].value,code:f[1].value,start_date:f[2].value,total_sessions:+f[3].value,start_time:f[4].value,end_time:f[5].value,teacher_name:f[6].value,assistant_name:f[7].value,room:f[8].value,level:f[9].value,curriculum:f[10].value,expected_outcomes:f[11].value};const{error}=await db.from('classes').upsert(row,{onConflict:'code'});if(error)return alert(error.message);await loadSharedClasses();renderApp()}closeModal();showToast()}function showToast(message){document.getElementById('toast').innerHTML='<div class="toast">✓ '+(message||(state.lang==='vi'?'Đã lưu thay đổi thành công.':'Changes saved successfully.'))+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',2300)}
function studentsView(){return `<div class="panel-head"><div><h2>${t.students}</h2><p>IPA Academy • 248</p></div><button class="btn">＋</button></div><section class="panel"><div class="tasks">${['Nguyễn Minh Anh','Trần Gia Huy','Lê Khánh Linh','Phạm Đức Minh'].map((n,i)=>task(n,['I67-A','J4-B','IF-C','COM-A'][i])).join('')}</div></section>`}

let sessionDrafts=[];
function dateISO(d){return d.toISOString().slice(0,10)}
function buildSessions(){const count=Math.max(1,+document.getElementById('ccount')?.value||12),start=document.getElementById('cstart')?.value||dateISO(new Date()),st=document.getElementById('ctime1')?.value||'18:00',et=document.getElementById('ctime2')?.value||'19:30',days=[...document.querySelectorAll('.weekday-picks button.active')].map(b=>+b.dataset.day);let d=new Date(start+'T12:00:00'),out=[];for(let guard=0;out.length<count&&guard<730;guard++){if(!days.length||days.includes(d.getDay()))out.push({date:dateISO(d),start:st,end:et});d.setDate(d.getDate()+1)}sessionDrafts=out;renderSessions()}
function renderSessions(){const box=document.getElementById('session-list');if(!box)return;box.innerHTML=sessionDrafts.map((s,i)=>`<div class="session-row"><strong>#${i+1}</strong><input aria-label="Ngày buổi ${i+1}" type="date" value="${s.date}" onchange="editSession(${i},'date',this.value)"><input aria-label="Giờ bắt đầu ${i+1}" type="time" value="${s.start}" onchange="editSession(${i},'start',this.value)"><input aria-label="Giờ kết thúc ${i+1}" type="time" value="${s.end}" onchange="editSession(${i},'end',this.value)"><button type="button" onclick="removeSession(${i})">✕</button></div>`).join('');const n=document.getElementById('session-count-label');if(n)n.textContent=sessionDrafts.length}
function editSession(i,k,v){sessionDrafts[i][k]=v}
function addSession(){const last=sessionDrafts.at(-1),d=last?new Date(last.date+'T12:00:00'):new Date();d.setDate(d.getDate()+1);sessionDrafts.push({date:dateISO(d),start:last?.start||'18:00',end:last?.end||'19:30'});document.getElementById('ccount').value=sessionDrafts.length;renderSessions()}
function removeSession(i){sessionDrafts.splice(i,1);document.getElementById('ccount').value=sessionDrafts.length;renderSessions()}
function toggleWeekday(btn){btn.classList.toggle('active');buildSessions()}
function classModal(code){let c=classes.find(x=>x[0]===code),today=dateISO(new Date());document.getElementById('modal').innerHTML=`<div class="modal-layer"><div class="backdrop" onclick="closeModal()"></div><form class="modal" onsubmit="saveClass(event)"><div class="modal-head"><h2>${c?t.classes:t.createNew}</h2><button type="button" onclick="closeModal()">✕</button></div><div class="form"><label>${t.className}<input id="cname" required value="${c?.[1]||''}"></label><label>${t.classCode}<input id="ccode" required value="${c?.[0]||''}"></label><label>${t.startDate}<input id="cstart" type="date" value="${today}" onchange="buildSessions()"></label><label>${t.numSessions}<input id="ccount" type="number" min="1" max="200" value="${c?parseInt(c[6].split('/')[1]):12}" onchange="buildSessions()"></label><label>${t.startTime}<input id="ctime1" type="time" value="18:00" onchange="buildSessions()"></label><label>${t.endTime}<input id="ctime2" type="time" value="19:30" onchange="buildSessions()"></label><label>${t.teacher}<select id="cteacher"><option>Cô Mai Anh</option><option>Thầy David</option></select></label><label>${t.assistant}<select id="cassistant"><option>Ms. Linh</option><option>Mr. Nam</option></select></label><label>${t.room}<select id="croom"><option>Ocean</option><option>Forest</option><option>Sky</option></select></label><label>${t.level}<input id="clevel" value="${c?.[2]||''}"></label><label class="full">${t.weekdays}<div class="weekday-picks">${[[1,'T2'],[2,'T3'],[3,'T4'],[4,'T5'],[5,'T6'],[6,'T7'],[0,'CN']].map(x=>`<button type="button" data-day="${x[0]}" class="${[2,4].includes(x[0])?'active':''}" onclick="toggleWeekday(this)">${x[1]}</button>`).join('')}</div></label><div class="session-editor"><div class="session-editor-head"><div><h3>${state.lang==='vi'?'Lịch chi tiết từng buổi':'Detailed session schedule'}</h3><p>${state.lang==='vi'?'Có thể sửa ngày và giờ độc lập cho từng buổi.':'Edit the date and time of each session independently.'}</p></div><button type="button" class="btn secondary" onclick="addSession()">＋ ${state.lang==='vi'?'Thêm buổi':'Add session'}</button></div><div id="session-list" class="session-list"></div></div><label class="full">${t.curriculum}<textarea id="ccurriculum">IPA Core Curriculum 2026</textarea></label><label class="full">${t.outcomes}<textarea id="coutcomes">Expected proficiency for the selected learning pathway.</textarea></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">${t.cancel}</button><button class="btn">${c?'Save':t.create} (<span id="session-count-label">0</span> ${state.lang==='vi'?'buổi':'sessions'})</button></div></form></div>`;buildSessions()}
async function saveClass(e){e.preventDefault();const row={name:document.getElementById('cname').value,code:document.getElementById('ccode').value,start_date:document.getElementById('cstart').value,total_sessions:sessionDrafts.length,start_time:document.getElementById('ctime1').value,end_time:document.getElementById('ctime2').value,teacher_name:document.getElementById('cteacher').value,assistant_name:document.getElementById('cassistant').value,room:document.getElementById('croom').value,level:document.getElementById('clevel').value,curriculum:document.getElementById('ccurriculum').value,expected_outcomes:document.getElementById('coutcomes').value};if(db&&state.user){const{data,error}=await db.from('classes').upsert(row,{onConflict:'code'}).select('id').single();if(error)return alert(error.message);if(data?.id){await db.from('class_sessions').delete().eq('class_id',data.id);const payload=sessionDrafts.map((s,i)=>({class_id:data.id,session_no:i+1,session_date:s.date,start_time:s.start,end_time:s.end,status:'scheduled'}));const result=await db.from('class_sessions').insert(payload);if(result.error)return alert(result.error.message)}await loadSharedClasses()}else{const card=[row.code,row.name,row.level,0,row.teacher_name,sessionDrafts.length?sessionDrafts[0].date+' • '+sessionDrafts[0].start:'','0/'+sessionDrafts.length,row.room,0];classes=classes.filter(x=>x[0]!==row.code);classes.unshift(card);const saved=JSON.parse(localStorage.getItem('ipa_offline_classes')||'[]').filter(x=>x.row.code!==row.code);saved.unshift({row,sessions:sessionDrafts});localStorage.setItem('ipa_offline_classes',JSON.stringify(saved))}closeModal();renderApp();showToast(state.lang==='vi'?'Đã lưu lớp và lịch chi tiết từng buổi.':'Class and detailed sessions saved.')}

let weeklyRules={};
const weekdayNames={0:'Chủ nhật',1:'Thứ 2',2:'Thứ 3',3:'Thứ 4',4:'Thứ 5',5:'Thứ 6',6:'Thứ 7'};
function savedClass(code){try{return JSON.parse(localStorage.getItem('ipa_offline_classes')||'[]').find(x=>x.row.code===code)}catch(e){return null}}
function classCard(c){return `<article class="class-card" data-search="${c.join(' ').toLowerCase()}"><div class="class-head"><span class="code">${c[0]}</span><span class="status">${t.active}</span></div><h3>${c[1]}</h3><p>${c[2]} • ${t.classroom} ${c[7]}</p><div class="details"><div><small>${t.students}</small><b>${c[3]}</b></div><div><small>${t.teacher}</small><b>${c[4]}</b></div><div><small>${t.schedule}</small><b>${c[5]}</b></div><div><small>${t.sessions}</small><b>${c[6]}</b></div></div><progress value="${parseInt(c[6])}" max="${parseInt(c[6].split('/')[1])}"></progress><div class="class-card-actions"><button type="button" onclick="classModal('${c[0]}')">✎ ${state.lang==='vi'?'Chỉnh lớp & lịch học':'Edit class & schedule'}</button></div></article>`}
function renderWeeklyRules(){const box=document.getElementById('weekly-rules');if(!box)return;box.innerHTML=Object.keys(weeklyRules).map(Number).sort((a,b)=>(a||7)-(b||7)).map(day=>`<div class="weekly-rule"><b>${weekdayNames[day]}</b><label>${state.lang==='vi'?'Bắt đầu':'Start'}<input type="time" value="${weeklyRules[day].start}" onchange="updateWeeklyRule(${day},'start',this.value)"></label><label>${state.lang==='vi'?'Kết thúc':'End'}<input type="time" value="${weeklyRules[day].end}" onchange="updateWeeklyRule(${day},'end',this.value)"></label></div>`).join('')}
function updateWeeklyRule(day,key,value){weeklyRules[day][key]=value;buildSessions()}
function toggleWeekday(btn){const day=+btn.dataset.day;if(weeklyRules[day])delete weeklyRules[day];else weeklyRules[day]={start:document.getElementById('ctime1').value,end:document.getElementById('ctime2').value};btn.classList.toggle('active');renderWeeklyRules();buildSessions()}
function buildSessions(){const count=Math.max(1,+document.getElementById('ccount')?.value||12),start=document.getElementById('cstart')?.value||dateISO(new Date()),days=Object.keys(weeklyRules).map(Number);let d=new Date(start+'T12:00:00'),out=[];for(let guard=0;out.length<count&&guard<730;guard++){const day=d.getDay();if(days.includes(day)){const rule=weeklyRules[day];out.push({date:dateISO(d),start:rule.start,end:rule.end})}d.setDate(d.getDate()+1)}sessionDrafts=out;renderSessions()}

el||c?.[2]||''}"></label><div class="session-editor"><div class="session-editor-head"><div><h3>${state.lang==='vi'?'Lịch học trong tuần':'Weekly schedule'}</h3><p>${state.lang==='vi'?'Chọn ngày học, sau đó đặt giờ riêng tương ứng cho từng ngày.':'Select weekdays and set the corresponding time for each day.'}</p></div></div><div class="weekday-picks">${[[1,'T2'],[2,'T3'],[3,'T4'],[4,'T5'],[5,'T6'],[6,'T7'],[0,'CN']].map(x=>`<button type="button" data-day="${x[0]}" class="${weeklyRules[x[0]]?'active':''}" onclick="toggleWeekday(this)">${x[1]}</button>`).join('')}</div><div id="weekly-rules" class="weekly-rules"></div></div><div class="session-editor"><div class="session-editor-head"><div><h3>${state.lang==='vi'?'Chỉnh sửa lịch học cụ thể':'Edit individual sessions'}</h3><p>${state.lang==='vi'?'Thay đổi tại đây chỉ áp dụng cho đúng buổi được chọn.':'Changes here apply only to the selected session.'}</p></div><button type="button" class="btn secondary" onclick="addSession()">＋ ${state.lang==='vi'?'Thêm buổi':'Add session'}</button></div><div class="session-note">${state.lang==='vi'?'Ví dụ: đổi riêng buổi #5 sang ngày khác hoặc giờ khác mà không ảnh hưởng lịch tuần.':'Example: move session #5 without changing the weekly schedule.'}</div><div id="session-list" class="session-list"></div></div><label class="full">${t.curriculum}<textarea id="ccurriculum">${stored?.row.curriculum||'IPA Core Curriculum 2026'}</textarea></label><label class="full">${t.outcomes}<textarea id="coutcomes">${stored?.row.expected_outcomes||'Expected proficiency for the selected learning pathway.'}</textarea></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">${t.cancel}</button><button class="btn">${c?'Save':t.create} (<span id="session-count-label">0</span> ${state.lang==='vi'?'buổi':'sessions'})</button></div></form></div>`;renderWeeklyRules();if(stored?.sessions?.length){sessionDrafts=stored.sessions.map(x=>({...x}));renderSessions()}else buildSessions()}
async function saveClass(e){e.preventDefault();if(!Object.keys(weeklyRules).length)return alert(state.lang==='vi'?'Hãy chọn ít nhất một ngày học trong tuần.':'Select at least one weekday.');const row={name:document.getElementById('cname').value,code:document.getElementById('ccode').value,start_date:document.getElementById('cstart').value,total_sessions:sessionDrafts.length,start_time:document.getElementById('ctime1').value,end_time:document.getElementById('ctime2').value,teacher_name:document.getElementById('cteacher').value,assistant_name:document.getElementById('cassistant').value,room:document.getElementById('croom').value,level:document.getElementById('clevel').value,curriculum:document.getElementById('ccurriculum').value,expected_outcomes:document.getElementById('coutcomes').value,weekly_rules:weeklyRules};if(db&&state.user){const dbRow={...row};delete dbRow.weekly_rules;const{data,error}=await db.from('classes').upsert(dbRow,{onConflict:'code'}).select('id').single();if(error)return alert(error.message);if(data?.id){await db.from('class_sessions').delete().eq('class_id',data.id);const payload=sessionDrafts.map((s,i)=>({class_id:data.id,session_no:i+1,session_date:s.date,start_time:s.start,end_time:s.end,status:'scheduled'}));const result=await db.from('class_sessions').insert(payload);if(result.error)return alert(result.error.message)}await loadSharedClasses()}else{const first=Object.keys(weeklyRules).map(Number).sort((a,b)=>(a||7)-(b||7))[0],summary=Object.keys(weeklyRules).map(Number).sort((a,b)=>(a||7)-(b||7)).map(d=>weekdayNames[d]+' '+weeklyRules[d].start).join(', '),card=[row.code,row.name,row.level,0,row.teacher_name,summary,'0/'+sessionDrafts.length,row.room,0];classes=classes.filter(x=>x[0]!==row.code);classes.unshift(card);const saved=JSON.parse(localStorage.getItem('ipa_offline_classes')||'[]').filter(x=>x.row.code!==row.code);saved.unshift({row,sessions:sessionDrafts});localStorage.setItem('ipa_offline_classes',JSON.stringify(saved))}closeModal();renderApp();showToast(state.lang==='vi'?'Đã lưu lịch tuần và lịch từng buổi.':'Weekly and individual schedules saved.')}

function selectLoginQuote(){const last=Number(localStorage.getItem('ipa_last_quote'));let next=Math.floor(Math.random()*learningQuotes.length);if(learningQuotes.length>1&&next===last)next=(next+1+Math.floor(Math.random()*(learningQuotes.length-1)))%learningQuotes.length;state.quoteIndex=next;localStorage.setItem('ipa_last_quote',String(next))}
function login(r){selectLoginQuote();state.role=r;state.view='overview';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderApp()}
async function cloudLogin(e){e.preventDefault();if(!db)return setupSupabase();const email=document.getElementById('cloud-email').value,password=document.getElementById('cloud-password').value,button=e.submitter;button.disabled=true;button.textContent='...';const{data,error}=await db.auth.signInWithPassword({email,password});if(error){button.disabled=false;button.textContent='Đăng nhập';return alert(error.message)}const{data:profile,error:pErr}=await db.from('profiles').select('role,full_name').eq('id',data.user.id).single();if(pErr||!profile)return alert('Tài khoản chưa có hồ sơ hoặc vai trò.');selectLoginQuote();state.user=data.user;state.role=profile.role;state.view='overview';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadSharedClasses();renderApp()}

ress'}</p></div></div><form class="offline-auth" onsubmit="offlineLogin(event,'student')"><label>Username<input name="username" required placeholder="${vi?'Username học viên':'Student username'}"></label><label>Password<input name="password" type="password" required placeholder="${vi?'Mật khẩu':'Password'}"></label><button class="btn">${vi?'Đăng nhập Học viên':'Student sign in'}</button></form><div class="login-hint">${vi?'Tài khoản do Admin tạo.':'Account created by Admin.'}</div></article></div></div></section>`}
function offlineLogin(e,area){e.preventDefault();const form=e.currentTarget,username=form.elements.username.value.trim().toLowerCase(),password=form.elements.password.value,user=getOfflineUsers().find(x=>x.username===username&&x.password===password),vi=state.lang==='vi';if(!user)return alert(vi?'Username hoặc mật khẩu không đúng.':'Incorrect username or password.');if(user.role!==area)return alert(vi?`Tài khoản này thuộc khu vực ${user.role==='teacher'?'Giáo viên':user.role==='student'?'Học viên':'Admin'}.`:`This account belongs to the ${user.role} area.`);selectLoginQuote();state.user={username,fullName:user.fullName};state.role=user.role;state.view='overview';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderApp()}
function createOfflineAccount(e){e.preventDefault();const f=new FormData(e.target),username=String(f.get('username')).trim().toLowerCase(),password=String(f.get('password')),fullName=String(f.get('fullName')).trim(),role=String(f.get('role'));if(!/^[a-z0-9._-]{3,40}$/.test(username))return alert('Username chỉ gồm chữ thường, số, dấu chấm, gạch dưới hoặc gạch ngang.');if(password.length<8)return alert('Mật khẩu cần ít nhất 8 ký tự.');const users=getOfflineUsers();if(users.some(x=>x.username===username))return alert('Username đã tồn tại.');users.push({username,password,fullName,role});localStorage.setItem('ipa_offline_users',JSON.stringify(users));e.target.reset();renderApp();showToast(`Đã tạo tài khoản ${username}.`)}
function deleteOfflineAccount(username){if(username==='admin')return alert('Không thể xóa Admin mặc định.');if(!confirm(`Xóa tài khoản ${username}?`))return;localStorage.setItem('ipa_offline_users',JSON.stringify(getOfflineUsers().filter(x=>x.username!==username)));renderApp()}
function offlineAccountManager(){const users=getOfflineUsers();return `<section class="panel account-admin"><div class="panel-head"><div><h3>${state.lang==='vi'?'Tài khoản đăng nhập':'Login accounts'}</h3><p>${state.lang==='vi'?'Tạo username và mật khẩu cho Giáo viên/Học viên.':'Create usernames and passwords for teachers/students.'}</p></div></div><form class="offline-account-form" onsubmit="createOfflineAccount(event)"><label>${state.lang==='vi'?'Họ và tên':'Full name'}<input name="fullName" required></label><label>${state.lang==='vi'?'Vai trò':'Role'}<select name="role"><option value="teacher">${state.lang==='vi'?'Giáo viên':'Teacher'}</option><option value="student">${state.lang==='vi'?'Học viên':'Student'}</option></select></label><label>Username<input name="username" required minlength="3" pattern="[a-zA-Z0-9._-]+"></label><label>Password<input name="password" type="password" required minlength="8"></label><button class="btn">${state.lang==='vi'?'Tạo tài khoản':'Create'}</button></form><div class="user-list">${users.map(u=>`<div class="user-row"><span><b>${safeText(u.fullName)}</b><br><small>${safeText(u.username)}</small></span><span>${u.role==='admin'?'Admin':u.role==='teacher'?(state.lang==='vi'?'Giáo viên':'Teacher'):(state.lang==='vi'?'Học viên':'Student')}</span><span>${u.username==='admin'?'Mặc định':`<button class="btn secondary" onclick="deleteOfflineAccount('${u.username}')">${state.lang==='vi'?'Xóa':'Delete'}</button>`}</span></div>`).join('')}</div></section>`}
function studentsView(){const manager=state.role==='admin'?offlineAccountManager():'';return `${manager}<div class="panel-head"><div><h2>${t.students}</h2><p>IPA Academy • 248</p></div><button class="btn">＋</button></div><section class="panel"><div class="tasks">${['Nguyễn Minh Anh','Trần Gia Huy','Lê Khánh Linh','Phạm Đức Minh'].map((n,i)=>task(n,['I67-A','J4-B','IF-C','COM-A'][i])).join('')}</div></section>`}
initSupabase();renderLogin();
</script>
</body></html>
